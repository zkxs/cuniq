[package]
name = "cuniq"
version = "1.1.0"
description = "Count unique lines"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
autobenches = false
rust-version = "1.74.1"

# despite the workspace emitting warnings, these profiles ARE used when `cargo install`ing the crate
# tracking issue: https://github.com/rust-lang/cargo/issues/8264
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release-optimized-debug]
inherits = "release"
strip = false # required for `cargo-bloat`
debug = true # required for `cargo flamegraph`, and makes `cargo-bloat` output significantly better

[features]
default = ["parallel", "memmap", "compile-time-rng"]
# Ability to read files via memory-mapping
memmap = ["dep:memmap2"]
# Ability to process data using multiple threads
parallel = ["memmap", "dep:num_cpus", "dep:crossbeam-channel"]
# Enables compile-time RNG for ahash seed
compile-time-rng = ["ahash/compile-time-rng"]
# Features required for the benchmarks to run. This feature set is not stable and should not be used outside of running the benchmarks.
bench = ["parallel"]

[dependencies]
ahash = { workspace = true, default-features = false } # More performant hashing algorithm
bstr.workspace = true
cfg-if = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
crossbeam-channel = { version = "0.5", optional = true }
line_cardinality = { path = "../line_cardinality", version = "3" }
memchr = { version = "2" }
memmap2 = { version = "0.9", optional = true }
num_cpus = { version = "1", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "benches"
harness = false
required-features = ["bench"]
